name: k6 Stress

# THE LOAD RUNS HERE, ON A DISPOSABLE RUNNER, NEVER ON A LAPTOP.
#
# The first time this harness was run it pointed at the operator's machine: 10 virtual users for 75
# seconds, against a development-mode API, while that machine was also running the editor, the browser
# and the agent. It froze. Not because 10 users is a lot, but because a workstation is not a load
# target and a number taken there describes that workstation.
#
# So the split is by profile, not by trigger:
#
#   - The DEFAULT profile (small) runs on every pull request and on push to main. It runs on GitHub's
#     disposable runner, so it costs the operator nothing, and it is what makes the harness an actual
#     gate rather than a script nobody has ever run. A harness that only exists behind a manual
#     dispatch has never run, and an unrun gate is not a gate.
#   - The HEAVY profile (capacity, per the operator's decision) stays dispatch-only and is asked for by
#     name.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario to run'
        required: true
        default: 'read'
        type: choice
        options:
          - read
          - r6
          - write
      vus:
        description: 'Concurrent virtual users (write scenario defaults to 3)'
        required: true
        default: '25'
      ramp:
        description: 'Ramp-up duration'
        required: true
        default: '2m'
      duration:
        description: 'Steady-state duration'
        required: true
        default: '5m'
      base_url:
        description: 'API base URL. A hosted staging or a dedicated load host — never production.'
        required: true
        default: 'https://staging-api.example.com/api/v1'

permissions:
  contents: read

concurrency:
  # Two load runs against one target measure each other's load. On a pull request, superseding is
  # right: a new push makes the previous run's numbers a measurement of source nobody will ship.
  group: k6-stress-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # On a pull request or a push there are no `inputs` at all, so a step reading `inputs.scenario`
      # compares against the empty string and skips itself — a workflow that silently does nothing on
      # the events it was added for. Resolve the effective profile once, here, so no later step has to
      # think about it and an automatic run cannot quietly no-op.
      - name: Resolve the profile for this event
        id: profile
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SCENARIO="${{ inputs.scenario }}"
            VUS="${{ inputs.vus }}"
            RAMP="${{ inputs.ramp }}"
            DURATION="${{ inputs.duration }}"
            HEAVY="--allow-heavy"
            TARGET="${{ inputs.base_url }}"
          else
            # The default profile. Small enough to be unremarkable on a shared runner, large enough
            # that a missing index on the catalogue or on the aggregation shows up as p95 rather than as
            # one lucky request.
            SCENARIO="read"
            VUS="5"
            RAMP="20s"
            DURATION="30s"
            HEAVY=""
            # On an automatic run the target is the API this job starts and seeds itself. That is what
            # makes an automatic run possible at all without pointing a load test at anything that
            # matters — a self-contained disposable target is the only safe default here.
            TARGET="http://127.0.0.1:4000/api/v1"
          fi
          {
            echo "scenario=${SCENARIO}"
            echo "vus=${VUS}"
            echo "ramp=${RAMP}"
            echo "duration=${DURATION}"
            echo "heavy=${HEAVY}"
            echo "target=${TARGET}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### k6 stress"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| trigger | ${{ github.event_name }} |"
            echo "| scenario | ${SCENARIO} |"
            echo "| virtual users | ${VUS} |"
            echo "| ramp | ${RAMP} |"
            echo "| hold | ${DURATION} |"
            echo "| heavy override | ${HEAVY:-no} |"
            echo "| target | ${TARGET} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # k6 from the official binary. No npm wrapper: a load generator should not be a dependency of
      # the thing it measures, and a version bump should be a deliberate line in this file.
      - name: Install k6
        run: |
          set -euo pipefail
          # Pinned, and visible in the diff, because the load generator's own overhead is part of what
          # it reports. A float upgrade should be a deliberate edit here, not a resolution at run time.
          K6_VERSION="v1.0.0"
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | tar -xz
          sudo install -m 0755 "k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - run: npm ci

      # An automatic run has to own its target, so it brings one up: SQLite prepared and seeded, then
      # the API started on 127.0.0.1:4000. This is a disposable instance created by this job, which is
      # the only reason pointing a load test at it is safe. A dispatch run targets a deployment the
      # operator named, and skips all of this.
      - name: Start a disposable API for an automatic run
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          # The credential for this instance is generated here, per run, and never leaves the runner.
          # `.env.local.example` ships `SEED_ADMIN_PASSWORD=Admin123!` for local demo use; that is a
          # published default, so it is overwritten rather than inherited. `ci-prepare-github-simulation`
          # requires at least 14 characters, so a shorter random string would fail the seed in a way
          # that reads as a harness bug.
          LOAD_PASSWORD="$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)"
          if [ "${#LOAD_PASSWORD}" -lt 14 ]; then
            echo "::error::generated load password is too short for the seed"
            exit 1
          fi
          cp .env.local.example .env
          # Replace the seeded admin password rather than append a second definition. `db:local:prepare`
          # loads this file with `dotenv -e ../../.env`, and which of two identical keys survives depends
          # on the dotenv version, so leaving `Admin123!` in the file and hoping a later line wins is not a
          # thing to rely on for a credential.
          sed -i '/^SEED_ADMIN_PASSWORD=/d' .env
          # `.env.local.example` sets `SEED_MODE=demo`, and in demo mode the seed fixes the admin address
          # to `admin@toko360.local` regardless of `SEED_ADMIN_EMAIL` — `apps/api/prisma/seed.ts` reads
          # that address as a literal and only consults the environment in bootstrap mode. The first
          # execution of this workflow got a 401 because it logged in with an address the seed had never
          # created. `.local` is reserved by RFC 6762 and cannot resolve, so nothing can be delivered to it.
          SEED_ADMIN_EMAIL="admin@toko360.local"
          {
            echo ""
            echo "# Written by .github/workflows/k6-stress.yml for this run only."
            echo "SEED_ADMIN_PASSWORD=${LOAD_PASSWORD}"
            echo "T360_UAT_ENVIRONMENT=GITHUB_K6_LOAD"
          } >> .env
          # The same values reach the mint step through the environment rather than through a second
          # copy of the password in this file.
          echo "SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=${LOAD_PASSWORD}" >> "$GITHUB_ENV"
          npm run db:local:prepare
          npm run build -w @toko360/worker
          npm run dev -w @toko360/api &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/api/v1/health >/dev/null 2>&1; then
              echo "disposable API ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the disposable API never became healthy"
          exit 1

      # A load run needs a session, and an anonymous run is refused at the auth guard before the query
      # ever runs — which measures the guard and then reports a fast number for a request that was
      # never served. So mint a real session against the instance this job owns.
      #
      # `apps/api/src/auth/auth.controller.ts` exposes `POST /auth/login` taking `{email, password}`,
      # and `auth.service.ts` returns `accessToken`. The runner expects that field name, so renaming it
      # here would silently produce an empty Authorization header rather than an obvious 401.
      - name: Mint a load-test session for an automatic run
        if: github.event_name != 'workflow_dispatch'
        env:
          T360_API_URL: http://127.0.0.1:4000/api/v1
        run: |
          set -euo pipefail
          if [ -z "${SEED_ADMIN_EMAIL:-}" ] || [ -z "${SEED_ADMIN_PASSWORD:-}" ]; then
            echo "::error::no load credential reached this step"
            exit 1
          fi
          if [ "${SEED_ADMIN_PASSWORD}" = "Admin123!" ]; then
            echo "::error::refusing to authenticate with the published demo password"
            exit 1
          fi
          TOKEN=$(curl -fsS -X POST "${T360_API_URL}/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"${SEED_ADMIN_EMAIL}\",\"password\":\"${SEED_ADMIN_PASSWORD}\"}" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.accessToken||'')})")
          if [ -z "${TOKEN}" ]; then
            echo "::error::could not mint a load-test session against the disposable instance"
            exit 1
          fi
          echo "K6_STRESS_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          echo "load session minted"

      - name: Refuse a production-shaped target before anything connects
        env:
          TARGET: ${{ steps.profile.outputs.target }}
        run: |
          set -euo pipefail
          HOST=$(node -e "console.log(new URL(process.argv[1]).hostname)" "$TARGET")
          echo "target host: ${HOST}"
          if printf '%s' "${HOST}" | grep -Eq '(^|[.-])(prod|production|live)([.-]|$)|(^|\.)toko360\.com$'; then
            echo "::error::refusing to load test ${HOST}; it looks like production"
            exit 1
          fi
          # The production-shaped refusal above applies to both paths. The approved-host pin applies only
          # to a dispatch run, because that is the only path that targets something this repository does
          # not own. An automatic run points at the loopback instance this job started, which nobody needs
          # to authorise; requiring a repository variable for it made every automatic run fail before k6
          # ran, which is how the second execution of this workflow stopped with the variable unset.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if [ "${HOST}" != "127.0.0.1" ]; then
              echo "::error::an automatic run must target the instance it started (127.0.0.1), not ${HOST}"
              exit 1
            fi
            echo "automatic run: target is this job's own instance on the loopback interface"
            exit 0
          fi
          if [ -z "${{ vars.K6_STRESS_ALLOWED_HOST }}" ]; then
            echo "::error::repository variable K6_STRESS_ALLOWED_HOST is not set."
            echo "Set it to the exact hostname this stress run is permitted to hit. An unset variable"
            echo "means nobody has authorised a target, which is not the same as any host being fine."
            exit 1
          fi
          if [ "${HOST}" != "${{ vars.K6_STRESS_ALLOWED_HOST }}" ]; then
            echo "::error::${HOST} is not the approved stress target (${{ vars.K6_STRESS_ALLOWED_HOST }})"
            exit 1
          fi

      - name: Read stress
        if: steps.profile.outputs.scenario == 'read'
        env:
          TARGET: ${{ steps.profile.outputs.target }}
          VUS: ${{ steps.profile.outputs.vus }}
          RAMP: ${{ steps.profile.outputs.ramp }}
          DURATION: ${{ steps.profile.outputs.duration }}
          HEAVY: ${{ steps.profile.outputs.heavy }}
          K6_STRESS_TOKEN: ${{ env.K6_STRESS_TOKEN || secrets.K6_STRESS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${K6_STRESS_TOKEN}" ]; then
            echo "::error::secret K6_STRESS_READ_TOKEN is not configured. An unauthenticated run measures"
            echo "the auth guard before the query, which is not a performance result."
            exit 1
          fi
          npm run test:load:k6 -- \
            --base-url "$TARGET" \
            --allow-nonproduction $HEAVY \
            --vus "$VUS" \
            --ramp "$RAMP" \
            --duration "$DURATION"

      # R6 is the surface the release chain never loaded: its functional probe calls each route once,
      # in sequence, and the one load gate in the chain points at /api/v1/health. This step is where
      # that gets covered. It performs bounded writes (materialize, marketplace import), each keyed per
      # iteration, so it is not a write opt-in scenario and does not need one.
      - name: R6 scale stress
        if: steps.profile.outputs.scenario == 'r6'
        env:
          TARGET: ${{ steps.profile.outputs.target }}
          VUS: ${{ steps.profile.outputs.vus }}
          RAMP: ${{ steps.profile.outputs.ramp }}
          DURATION: ${{ steps.profile.outputs.duration }}
          HEAVY: ${{ steps.profile.outputs.heavy }}
          K6_STRESS_TOKEN: ${{ env.K6_STRESS_TOKEN || secrets.K6_STRESS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${K6_STRESS_TOKEN}" ]; then
            echo "::error::secret K6_STRESS_READ_TOKEN is not configured."
            exit 1
          fi
          npm run test:load:k6:r6 -- \
            --base-url "$TARGET" \
            --allow-nonproduction $HEAVY \
            --vus "$VUS" \
            --ramp "$RAMP" \
            --duration "$DURATION"

      # The write scenario is a SEPARATE job so that choosing it is an explicit act in the Actions UI
      # rather than a consequence of the read one. It creates real sales, journals and stock movements
      # on whatever host is approved, and it needs its own credential because a read role must not be
      # able to write.
      - name: Write stress
        if: steps.profile.outputs.scenario == 'write'
        env:
          TARGET: ${{ steps.profile.outputs.target }}
          VUS: ${{ steps.profile.outputs.vus }}
          RAMP: ${{ steps.profile.outputs.ramp }}
          DURATION: ${{ steps.profile.outputs.duration }}
          HEAVY: ${{ steps.profile.outputs.heavy }}
          K6_STRESS_TOKEN: ${{ secrets.K6_STRESS_WRITE_TOKEN }}
          K6_STRESS_SKU: ${{ vars.K6_STRESS_SKU }}
          K6_STRESS_CUSTOMER_ID: ${{ vars.K6_STRESS_CUSTOMER_ID }}
          K6_STRESS_WAREHOUSE_ID: ${{ vars.K6_STRESS_WAREHOUSE_ID }}
        run: |
          set -euo pipefail
          for required in K6_STRESS_TOKEN K6_STRESS_SKU K6_STRESS_WAREHOUSE_ID; do
            if [ -z "${!required}" ]; then
              echo "::error::${required} is not configured. Guessing a SKU or a warehouse would post against"
              echo "whatever happens to be first, so this stops instead."
              exit 1
            fi
          done
          echo "::warning::this creates real sales, journals and stock movements on ${TARGET}"
          npm run test:load:k6:write -- \
            --base-url "$TARGET" \
            --allow-nonproduction $HEAVY --allow-writes \
            --vus "$VUS" \
            --ramp "$RAMP" \
            --duration "$DURATION"

      - name: Publish stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-stress-evidence
          path: handoff/quality/k6-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Carry the measured numbers into the job summary
        if: always()
        run: |
          set -euo pipefail
          FILE=$(ls handoff/quality/k6-*.json 2>/dev/null | head -1 || true)
          if [ -z "${FILE}" ]; then
            echo "No stress evidence was produced."
            exit 1
          fi
          node -e "
            const d = require('./${FILE}');
            const rows = [
              ['scenario', d.scenario], ['status', d.status], ['profile', JSON.stringify(d.profile)],
              ['requests', d.requests], ['iterations', d.iterations],
              ['p95 ms', Math.round(d.durationP95Ms || 0)], ['p99 ms', Math.round(d.durationP99Ms || 0)],
              ['error rate', d.httpReqFailedRate], ['checks', d.checksRate],
            ];
            let out = '| | |\\n|---|---|\\n';
            for (const [k, v] of rows) out += \`| \${k} | \${v} |\\n\`;
            if (d.thresholdFailures.length) out += \`\\n**Broken thresholds**\\n\n\` + d.thresholdFailures.map(t => \`- \${t}\`).join('\\n') + '\\n';
            process.stdout.write(out);
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the stress run did not pass
        if: always()
        run: |
          set -euo pipefail
          FILE=$(ls handoff/quality/k6-*.json 2>/dev/null | head -1 || true)
          [ -n "${FILE}" ] || { echo "::error::no evidence file; a run that produced nothing is not a pass"; exit 1; }
          STATUS=$(node -e "console.log(require('./${FILE}').status)")
          if [ "${STATUS}" != "PASS" ]; then
            echo "::error::stress run status ${STATUS}"
            exit 1
          fi
